<body>
<div id="wrap"></div><div id="txt"></div><div id="tc"></div>
<script type="module">
import * as THREE from 'three';
import { drawLabel, drawLogo, drawEndCard, pal, shade, ink } from './js/brandart.js';

/* ---------- Escenario ---------- */
const wrap = document.getElementById('wrap'), txt = document.getElementById('txt'), tc = document.getElementById('tc');
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(1.5, devicePixelRatio)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; wrap.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#fff8ec');
const camera = new THREE.PerspectiveCamera(35, 16 / 9, 0.05, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#c9b8a0', 1.15); scene.add(hemi);
const key = new THREE.DirectionalLight('#fff4e0', 2.1); key.position.set(4, 7, 5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 30 }); key.shadow.bias = -0.0008; scene.add(key);
const rim = new THREE.DirectionalLight('#cfe3ff', 0.9); rim.position.set(-5, 4, -6); scene.add(rim);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.7, ...o });
let SET = new THREE.Group(), ACT = new THREE.Group(); scene.add(SET, ACT);
function fit() { const W = innerWidth, H = innerHeight; let w = W, h = W * 9 / 16; if (h > H) { h = H; w = H * 16 / 9; } renderer.setSize(Math.floor(w), Math.floor(h)); camera.aspect = 16 / 9; camera.updateProjectionMatrix(); dirty = true; }
let dirty = true, lastR = 0;
addEventListener('resize', fit); setTimeout(fit);

/* ---------- Azar con semilla (cada toma se ve igual siempre: los fotogramas clave salen idénticos) ---------- */
function rng(seed) { let a = 0; for (const c of String(seed)) a = (a * 31 + c.charCodeAt(0)) | 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Marca ---------- */
let KIT = null; const TEX = new Map();
function labelTex(p) { const k = p.id; if (TEX.has(k)) return TEX.get(k); const c = drawLabel(document.createElement('canvas'), KIT, p, { w: 2048, h: 1024 }); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.offset.x = 0.5; t.anisotropy = 4; TEX.set(k, t); return t; }
const products = () => (KIT && KIT.products) || [];
const prod = id => products().find(p => p.id === id || p.name === id) || products()[0];
const color = id => (prod(id) || {}).color || '#e11d48';

/* ---------- Piezas ---------- */
function tube(p, { open = false } = {}) { const g = new THREE.Group(); const R = 0.38, H = 2.3;

/* ---------- Decorados ---------- */

  if (name === 'huerta') { scene.background = new THREE.Color('#9fd3f5'); scene.fog = new THREE.Fog('#cfe9f7', 14, 40); hemi.groundColor.set('#7a5a3a');
    const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M('#7a5532')); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; SET.add(g);
    for (let i = -6; i <= 6; i++) { const f = new THREE.Mesh(new THREE.BoxGeometry(30, 0.12, 0.5), M(i % 2 ? '#8a6038' : '#6d4a2a')); f.position.set(0, 0.04, i * 0.9); f.receiveShadow = true; SET.add(f); }

    for (let i = 0; i < 6; i++) { const h = new THREE.Mesh(new THREE.IcosahedronGeometry(6 + i % 3 * 2, 0), M(i % 2 ? '#6fbf58' : '#57a845')); h.position.set(-25 + i * 10, -2, -30 - (i % 2) * 6); h.scale.y = 0.45; SET.add(h); }
    const sun = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 1), new THREE.MeshBasicMaterial({ color: '#ffe08a', fog: false })); sun.position.set(-9, 9, -30); SET.add(sun); }
  else if (name === 'cocina') { sweep(shade(fondo, -0.04)); const counter = new THREE.Mesh(new THREE.BoxGeometry(9, 0.9, 2.4), M('#e9e4da')); counter.position.set(0, -0.45, 0); counter.receiveShadow = true; SET.add(counter);

    const board = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 1.3), M('#d9a46a')); board.position.set(0, 0.1, 0.2); board.receiveShadow = true; SET.add(board); SET.userData.floorY = 0.14; }

    const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M('#6aa84f')); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; SET.add(g);
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const acc = KIT ? pal(KIT, 'acento', '#e11d48') : '#e11d48'; for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { x.fillStyle = (i + j) % 2 ? acc : '#ffffff'; x.fillRect(i * 32, j * 32, 32, 32); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; const bl = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })); bl.rotation.x = -Math.PI / 2; bl.position.y = 0.01; bl.receiveShadow = true; SET.add(bl);
    for (const [px, pz, s] of [[-5, -6, 1.2], [6, -8, 1.5], [9, -3, 1], [-8, -2, 0.9]]) { const t = new THREE.Group(); const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.6, 6), M('#6b4a2f')); tr.position.y = 0.8; const cr = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), M('#3c8d3f')); cr.position.y = 2.2; tr.castShadow = cr.castShadow = true; t.add(tr, cr); t.position.set(px, 0, pz); t.scale.setScalar(s); SET.add(t); } }

/* ---------- Acciones (todo es función del tiempo: misma t = mismo fotograma) ---------- */
let SHOT = null, UPDATE = () => {}, FOCUS = new THREE.Vector3(0, 1, 0), RADIUS = 3;

        add(v, t => { const k = clamp01((t - 0.6) / 3); v.scale.setScalar(1.25 * (1 - k * 0.7)); v.rotation.y = t * 0.6; });

      for (let s = 0; s < 22; s++) { const c = chip(p.color, p.id + 'f' + s); const side = s % 2 ? 1 : -1, d = 0.2 + s * 0.16, sx = side * (2.2 + r()), sy = 2.6 + r() * 0.8, rot = r() * 6;

      add(tag, t => { tag.material.opacity = ease((t - 2.0) / 0.6); });
      FOCUS.set(0, 2.0, 0); RADIUS = Math.max(4, n * 0.85); break; }
    default: { const p = fl[0] || ps[0]; if (!p) break; const tb = tube(p); tb.position.y = y0 + 0.3; add(tb, t => { tb.rotation.y = t * 0.6; tb.position.y = y0 + 0.3 + Math.sin(t * 1.6) * 0.08; });
      for (let s = 0; s < 10; s++) { const c = chip(p.color, p.id + 'o' + s); const a0 = s / 10 * Math.PI * 2; add(c, t => { const a = a0 + t * 0.8; c.position.set(Math.cos(a) * 1.3, y0 + 1.3 + Math.sin(a * 2) * 0.4, Math.sin(a) * 1.3); c.rotation.set(t * 2 + s, t + s, 0); }); }
      FOCUS.set(0, 1.4, 0); RADIUS = 2.8; }
  }
  UPDATE = t => { for (const u of parts) u(t); };
}

/* ---------- Cámara (movimientos de anuncio) ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function camAt(shot, t) { const d = shot.dur || 5, k = ease(t / d), c = FOCUS, R = RADIUS; let p, l = c.clone(), fov = 35;
  switch (shot.camera) {
    case 'crane_up': p = V(0, c.y * 0.3 + 0.4, R * 1.9).lerp(V(0, c.y + R * 1.1, R * 1.7), k); l = V(c.x, c.y * (1 - k * 0.4), c.z); break;
    case 'dolly_in': p = V(R * 0.25, c.y + R * 0.35, R * 2.3).lerp(V(R * 0.1, c.y + R * 0.15, R * 1.25), k); break;
    case 'orbit': { const a = -0.55 + 1.1 * k; p = V(c.x + Math.sin(a) * R * 1.7, c.y + R * 0.35, c.z + Math.cos(a) * R * 1.7); break; }
    case 'push_macro': p = V(R * 0.25, c.y + R * 0.35, R * 1.6).lerp(V(0.12, c.y + R * 0.12, R * 1.0), k); fov = 30; break;
    case 'slide': p = V(-R * 0.9 + R * 1.8 * k, c.y + R * 0.25, R * 1.8); break;
    case 'top_down': { const a = k * 0.8; p = V(Math.sin(a) * 0.6, c.y + R * 2.4, Math.cos(a) * 0.6 + 0.4); break; }
    case 'hero_low': p = V(R * 0.7, 0.3, R * 1.9).lerp(V(R * 0.3, 0.4, R * 1.55), k); l = V(c.x, c.y * 1.15, c.z); fov = 32; break;
    default: p = V(0, c.y + R * 0.3, R * 1.9); }
  return { p, l, fov }; }

/* ---------- Reproducción ---------- */
let T = 0, playing = false, last = performance.now(), loop = true;
function setShot(shot) { SHOT = { dur: 5, camera: 'dolly_in', set: 'estudio', ...shot }; buildSet(SHOT.set, SHOT); buildAction(SHOT); T = 0; applyT(0); txt.textContent = SHOT.onscreen || ''; }
function applyT(t) { if (!SHOT) return; dirty = true; UPDATE(t); const c = camAt(SHOT, t); camera.position.copy(c.p); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.lookAt(c.l);
  const d = SHOT.dur || 5; txt.classList.toggle('on', !!SHOT.onscreen && t > d * 0.35 && t < d - 0.2); tc.textContent = `${SHOT.title ? SHOT.title + ' · ' : ''}${t.toFixed(1)} / ${d}s`; }
// Solo se pinta cuando algo cambia (y como mucho a 30 fps): ahorra batería y no ahoga la página en equipos modestos.
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; if (innerWidth < 2) return;
  if (playing && SHOT) { T += dt; const d = SHOT.dur || 5; if (T >= d) { if (loop) T = 0; else { T = d; playing = false; parent.postMessage({ type: 'ads-ended', id: SHOT.id }, '*'); } } applyT(T); dirty = true; }
  else if (!SHOT && ACT.userData.spin) { for (const o of ACT.children) o.rotation.y += dt * 0.35; dirty = true; }
  if (!dirty || now - lastR < 32) return; lastR = now; dirty = false; renderer.render(scene, camera); }
requestAnimationFrame(frame);

// Escaparate de productos (pestaña Productos): todos los envases girando
function showroom() { SHOT = null; buildSet('estudio', {}); scene.remove(ACT); ACT = new THREE.Group(); scene.add(ACT); const ps = products(), n = Math.max(1, ps.length); ps.forEach((p, i) => { const tb = tube(p); tb.position.x = (i - (n - 1) / 2) * 1.05; tb.rotation.y = 0; ACT.add(tb); });
  dirty = true; camera.position.set(0, 1.8, Math.max(5, n * 1.25)); camera.fov = 35; camera.updateProjectionMatrix(); camera.lookAt(0, 1.15, 0); txt.classList.remove('on'); tc.textContent = ''; ACT.rotation.y = 0; ACT.userData.spin = true; }
// Fotograma clave: render a 1280×720 en el instante pedido
function keyframe(t, w = 1280, h = 720) { const was = { T, playing }; playing = false; applyT(t); const ow = renderer.domElement.width, oh = renderer.domElement.height, pr = renderer.getPixelRatio(); renderer.setPixelRatio(1); renderer.setSize(w, h, false); renderer.render(scene, camera); const url = renderer.domElement.toDataURL('image/png'); renderer.setPixelRatio(pr); fit(); T = was.T; playing = was.playing; applyT(T); return url; }
async function record(id) { if (!SHOT || !renderer.domElement.captureStream || !window.MediaRecorder) throw new Error('Este navegador no puede grabar'); const st = renderer.domElement.captureStream(30); const mime = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || ''; const rec = new MediaRecorder(st, mime ? { mimeType: mime, videoBitsPerSecond: 6e6 } : {}); const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r); T = 0; loop = false; playing = true; rec.start(250); await new Promise(r => { const iv = setInterval(() => { if (!playing) { clearInterval(iv); r(); } }, 50); }); rec.stop(); await done; loop = true; return new Blob(chunks, { type: rec.mimeType || 'video/webm' }); }

addEventListener('message', async e => { const m = e.data || {}; if (e.source !== parent && e.source !== window) return;
  try {
    if (m.type === 'kit') { KIT = m.kit; for (const t of TEX.values()) t.dispose(); TEX.clear(); if (SHOT) setShot(SHOT); }
    else if (m.type === 'showroom') showroom();
    else if (m.type === 'shot') { setShot(m.shot); playing = m.play !== false; loop = m.loop !== false; last = performance.now(); }
    else if (m.type === 'play') { playing = true; last = performance.now(); } else if (m.type === 'pause') playing = false;
    else if (m.type === 'seek') { T = +m.t || 0; applyT(T); }
    else if (m.type === 'keyframe') { if (m.shot) setShot(m.shot); const url = keyframe(m.t != null ? m.t : (SHOT.dur || 5) * 0.55, m.w, m.h); parent.postMessage({ type: 'keyframe', id: m.id, png: url }, '*'); }
    else if (m.type === 'record') { if (m.shot) setShot(m.shot); const blob = await record(m.id); parent.postMessage({ type: 'recorded', id: m.id, blob }, '*'); }
  } catch (err) { parent.postMessage({ type: 'ads-error', id: m.id, error: String(err && err.message || err) }, '*'); } });
addEventListener('pointerdown', () => { if (SHOT) { playing = !playing; last = performance.now(); } });
window.__ads = { setShot, keyframe, get KIT() { return KIT; }, scene, camera };
parent.postMessage({ type: 'ads-ready' }, '*');
</script>
</body>
