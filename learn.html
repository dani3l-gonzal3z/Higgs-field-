// 🎓 El profe low-poly: habla con la boca sincronizada al texto (vocales y cierres), gesticula y escribe en la pizarra.
import * as THREE from 'three';

/* ---------- Profe ---------- */

  const br = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.018, 0.02), mats.hair); br.position.set(sx, 0.15, 0.285); br.rotation.z = sx > 0 ? -0.08 : 0.08; head.add(br); e.userData.brow = br; }
// Boca: hueco oscuro + dientes + labios (anillo). Tres parámetros: apertura, anchura y redondez.
const mouth = new THREE.Group(); mouth.position.set(0, -0.135, 0.268); mouth.rotation.x = -0.12; head.add(mouth);

/* ---------- Formas de la boca (visemas) a partir del texto ---------- */
const SH = { rest: [0.04, 0.85, 0], A: [1, 1.0, 0], E: [0.55, 1.25, 0], I: [0.32, 1.35, 0], O: [0.78, 0.72, 0.65], U: [0.32, 0.5, 1], M: [0, 0.92, 0], F: [0.14, 1.05, 0], C: [0.26, 1.0, 0.1] };

  for (let i = 0; i < w.length; i++) { const c = w[i], n = w[i + 1] || '';
    if (c === 'h' && w[i - 1] !== 'c') continue; // la h no suena
    if (c === 'u' && (w[i - 1] === 'q' || (w[i - 1] === 'g' && /[eéií]/.test(n)))) continue; // que, qui, gue, gui
    if (VOW[c]) { out.push([VOW[c], 1.7]); continue; }
    if (/[mbp]/.test(c)) { out.push(['M', 0.9]); continue; }
    if (/[fv]/.test(c)) { out.push(['F', 0.8]); continue; }
    if (/[\p{L}\p{N}]/u.test(c)) out.push(['C', 0.7]);
  }
  return out;
}
// Línea de tiempo [{t, s}] para un texto con tiempos por palabra (s, e en segundos) o estimados.
function buildTimeline(text, words, rate = 1) {

  if (ws && ws.length !== toks.length) ws = null;
  if (!ws) { let t = 0.05; ws = toks.map(w => { const d = Math.max(0.18, w.replace(/[^\p{L}\p{N}]/gu, '').length * 0.075) / rate; const o = { w, s: t, e: t + d }; t = o.e + (/[.,;:!?…]$/.test(w) ? 0.28 / rate : 0.05 / rate); return o; }); }
  const tl = []; ws.forEach((x, i) => { const sh = letterShapes(x.w || toks[i] || ''); const tot = sh.reduce((a, b) => a + b[1], 0) || 1; let t = x.s; const k = (x.e - x.s) / tot;
    for (const [s, wt] of sh) { tl.push({ t, s }); t += wt * k; } tl.push({ t: x.e, s: 'rest' }); });
  return { tl, words: ws.map((x, i) => ({ ...x, w: toks[i] || x.w })) };
}

/* ---------- Habla ---------- */
const subEl = document.getElementById('sub');
let S = null; // { id, tl, words, clock(), done, audio, utter }
const target = { o: 0.04, w: 0.85, r: 0 }, cur = { o: 0.04, w: 0.85, r: 0 };
// Subtítulos por trozos: solo la frase que está sonando (cabe en dos líneas), no la intervención entera.
function chunkWords(words) { const max = innerWidth / innerHeight < 1 ? 42 : 70; const out = []; let cur = [], len = 0;
  words.forEach((x, i) => { cur.push(i); len += x.w.length + 1; const end = /[.!?…:;]$/.test(x.w) || (/,$/.test(x.w) && len > max * 0.55) || len > max; if (end) { out.push(cur); cur = []; len = 0; } }); if (cur.length) out.push(cur); return out; }

  if (!S || S._chunks === undefined || S._cw !== words) { if (S) { S._chunks = chunkWords(words); S._cw = words; } }
  const chunks = (S && S._chunks) || [words.map((_, i) => i)]; const ch = chunks.find(c => c.includes(Math.max(0, idx))) || chunks[0];
  subEl.innerHTML = ch.map(i => i === idx ? `<b>${esc(words[i].w)}</b>` : i < idx ? esc(words[i].w) : `<span class="d">${esc(words[i].w)}</span>`).join(' '); subEl.classList.add('on'); }
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
function finish(ok = true) { if (!S) return; const s = S; S = null; for (const o of ITEMS) if (!o.userData.shown) o.userData.shown = 0.0001; if (s.ext) { showSub(null); target.o = 0.04; target.w = 0.85; target.r = 0; return; } try { s.audio && (s.audio.pause(), URL.revokeObjectURL(s.audio.src)); } catch (e) {} try { if (s.utter) speechSynthesis.cancel(); } catch (e) {} showSub(null); target.o = 0.04; target.w = 0.85; target.r = 0; parent.postMessage({ type: 'spoken', id: s.id, ok }, '*'); }
function pickVoice(lang) { const vs = speechSynthesis.getVoices(); const l = (lang || 'es').toLowerCase(); return vs.find(v => v.lang && v.lang.toLowerCase().startsWith(l) && /natural|neural|google|online/i.test(v.name)) || vs.find(v => v.lang && v.lang.toLowerCase().startsWith(l)) || null; }
// Voz en la página principal (allí el navegador sí deja sonar tras el primer clic): aquí solo seguimos su reloj.
let EXT = { t: 0, at: 0, off: 0 };
function speakExternal(m) { finish(false); const { tl, words } = buildTimeline(m.text, m.words, m.words ? 1 : (m.rate || 1)); EXT = { t: 0, at: performance.now(), off: 0, running: true };
  S = { id: m.id, tl, words, ext: true, clock: () => EXT.t + (EXT.running ? (performance.now() - EXT.at) / 1000 : 0) + EXT.off }; S.total = words.length ? words[words.length - 1].e : 1;
  parent.postMessage({ type: 'est', id: m.id, total: S.total * (m.words ? 1 : (m.rate || 1)) }, '*'); revealPlan(); }
async function speak(m) {
  if (m.external) return speakExternal(m);
  finish(false); const rate = m.rate || 1;
  if (m.audio) { // audio ya generado (voz del aparato o de la nube): la boca sigue al reloj del audio
    const a = new Audio(URL.createObjectURL(m.audio)); a.playbackRate = 1; const { tl, words } = buildTimeline(m.text, m.words, 1);
    S = { id: m.id, tl, words, audio: a, clock: () => a.currentTime }; a.onended = () => finish(true); a.onerror = () => finish(false);
    try { await a.play(); } catch (e) { finish(false); } return; }
  if (!('speechSynthesis' in window)) { // sin voz: la boca se mueve igual y el subtítulo guía
    const { tl, words } = buildTimeline(m.text, null, rate); const t0 = performance.now(); const end = words.length ? words[words.length - 1].e + 0.2 : 1;
    S = { id: m.id, tl, words, clock: () => (performance.now() - t0) / 1000 }; S.timer = setTimeout(() => finish(true), end * 1000); return; }
  // Voz del navegador: estimamos los tiempos y nos re-sincronizamos con cada palabra que anuncia.
  const { tl, words } = buildTimeline(m.text, null, rate); const u = new SpeechSynthesisUtterance(m.text); const v = pickVoice(m.lang); if (v) u.voice = v; u.lang = (v && v.lang) || (m.lang === 'en' ? 'en-US' : 'es-ES'); u.rate = rate;
  let t0 = performance.now(), off = 0; const starts = []; let pos = 0; for (const x of words) { const i = m.text.indexOf(x.w, pos); starts.push(i < 0 ? pos : i); pos = (i < 0 ? pos : i) + x.w.length; }
  S = { id: m.id, tl, words, utter: u, clock: () => (performance.now() - t0) / 1000 + off };
  u.onboundary = e => { if (!S || S.utter !== u || e.name && e.name !== 'word') return; let k = 0; while (k + 1 < starts.length && starts[k + 1] <= e.charIndex) k++; const want = words[k].s; const now = (performance.now() - t0) / 1000; off = want - now; };
  u.onend = () => { if (S && S.utter === u) finish(true); }; u.onerror = () => { if (S && S.utter === u) finish(false); };
  // Red de seguridad: algunos navegadores no avisan del final (o no tienen voces); seguimos al acabar el tiempo estimado.
  const est = (words.length ? words[words.length - 1].e : 1) + 4; const guard = () => { if (S && S.utter === u) { if (speechSynthesis.speaking && S.clock() < est * 2) setTimeout(guard, 1000); else finish(true); } }; setTimeout(guard, est * 1000);
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- Ejemplos en 3D: el profe construye un modelo low-poly mientras explica ---------- */
const COL = { rojo: '#e5484d', azul: '#3b82f6', verde: '#22c55e', amarillo: '#facc15', naranja: '#fb923c', morado: '#a855f7', violeta: '#8b5cf6', rosa: '#f472b6', cian: '#22d3ee', turquesa: '#14b8a6', gris: '#9ca3af', negro: '#27272a', blanco: '#f4f4f5', marron: '#92400e', marrón: '#92400e', cobre: '#c26b3a', plata: '#cbd5e1', oro: '#eab308', dorado: '#eab308', beige: '#e7d3a8', piel: '#e9b48f', agua: '#38bdf8', fuego: '#f97316', tierra: '#a16207', hierba: '#4ade80' };
const colorOf = c => { const k = String(c || '').toLowerCase().trim(); return COL[k] || (/^#[0-9a-f]{3,8}$/i.test(k) ? k : '#94a3b8'); };
const stage = new THREE.Group(); scene.add(stage); const stageInner = new THREE.Group(); stage.add(stageInner);
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.08, 0.1, 10), M('#3a4358')); pedestal.position.y = -0.05; stage.add(pedestal); stage.visible = false;
let KIND = 'machine', ITEMS = [], GROUPS = {}, SCENE_ON = false, sceneT = 0, buildStart = 0, EXPLODE = 0, explodeT = 0, userT = 0;
function labelSprite(text) { const c = document.createElement('canvas'); const x = c.getContext('2d', { willReadFrequently: true }); const fs = 44; x.font = `700 ${fs}px system-ui,sans-serif`; const w = Math.ceil(x.measureText(text).width) + 36; c.width = w; c.height = fs + 26;
  x.font = `700 ${fs}px system-ui,sans-serif`; x.fillStyle = 'rgba(15,18,26,.85)'; x.beginPath(); x.roundRect(0, 0, w, c.height, 16); x.fill(); x.fillStyle = '#ffe28a'; x.textBaseline = 'middle'; x.fillText(text, 18, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); sp.renderOrder = 10; const h = 0.125; sp.scale.set(h * w / c.height, h, 1); sp.userData.s0 = sp.scale.clone(); return sp; }
const V = (a, d = [0, 0, 0]) => Array.isArray(a) ? [+a[0] || 0, +a[1] || 0, +a[2] || 0] : d;
function geomOf(it) { const z = Array.isArray(it.size) ? it.size.map(Number) : [Number(it.size) || 0.5];
  switch (it.shape) {
    case 'sphere': return new THREE.IcosahedronGeometry(z[0] || 0.3, 1);
    case 'cylinder': return new THREE.CylinderGeometry(z[0] || 0.25, z[2] ?? z[0] ?? 0.25, z[1] || 0.6, 10);
    case 'cone': return new THREE.ConeGeometry(z[0] || 0.25, z[1] || 0.6, 8);
    case 'torus': return new THREE.TorusGeometry(z[0] || 0.4, z[1] || 0.08, 6, 16);
    case 'capsule': return new THREE.CapsuleGeometry(z[0] || 0.15, z[1] || 0.5, 3, 8);
    case 'plane': return new THREE.BoxGeometry(z[0] || 1, z[1] || 1, 0.02);
    case 'ring': return new THREE.TorusGeometry(z[0] || 0.5, 0.012, 3, 48);
