/* ---------- Formas de la boca (visemas) a partir del texto ---------- */

    if (c === 'u' && (w[i - 1] === 'q' || (w[i - 1] === 'g' && /[eéií]/.test(n)))) continue; // que, qui, gue, gui
    if (VOW[c]) { out.push([VOW[c], 1.7]); continue; }
    if (/[mbp]/.test(c)) { out.push(['M', 0.9]); continue; }
    if (/[fv]/.test(c)) { out.push(['F', 0.8]); continue; }
    if (/[\p{L}\p{N}]/u.test(c)) out.push(['C', 0.7]);

    for (const [s, wt] of sh) { tl.push({ t, s }); t += wt * k; } tl.push({ t: x.e, s: 'rest' }); });
  return { tl, words: ws.map((x, i) => ({ ...x, w: toks[i] || x.w })) };
}

/* ---------- Habla ---------- */
const subEl = document.getElementById('sub');
let S = null; // { id, tl, words, clock(), done, audio, utter }
const target = { o: 0.04, w: 0.85, r: 0 }, cur = { o: 0.04, w: 0.85, r: 0 };
// Subtítulos por trozos: solo la frase que está sonando (cabe en dos líneas), no la intervención entera.

  words.forEach((x, i) => { cur.push(i); len += x.w.length + 1; const end = /[.!?…:;]$/.test(x.w) || (/,$/.test(x.w) && len > max * 0.55) || len > max; if (end) { out.push(cur); cur = []; len = 0; } }); if (cur.length) out.push(cur); return out; }

  const chunks = (S && S._chunks) || [words.map((_, i) => i)]; const ch = chunks.find(c => c.includes(Math.max(0, idx))) || chunks[0];
  subEl.innerHTML = ch.map(i => i === idx ? `<b>${esc(words[i].w)}</b>` : i < idx ? esc(words[i].w) : `<span class="d">${esc(words[i].w)}</span>`).join(' '); subEl.classList.add('on'); }
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

// Voz en la página principal (allí el navegador sí deja sonar tras el primer clic): aquí solo seguimos su reloj.
let EXT = { t: 0, at: 0, off: 0 };
function speakExternal(m) { finish(false); const { tl, words } = buildTimeline(m.text, m.words, m.words ? 1 : (m.rate || 1)); EXT = { t: 0, at: performance.now(), off: 0, running: true };
  S = { id: m.id, tl, words, ext: true, clock: () => EXT.t + (EXT.running ? (performance.now() - EXT.at) / 1000 : 0) + EXT.off }; S.total = words.length ? words[words.length - 1].e : 1;
  parent.postMessage({ type: 'est', id: m.id, total: S.total * (m.words ? 1 : (m.rate || 1)) }, '*'); revealPlan(); }
async function speak(m) {

  finish(false); const rate = m.rate || 1;
  if (m.audio) { // audio ya generado (voz del aparato o de la nube): la boca sigue al reloj del audio
    const a = new Audio(URL.createObjectURL(m.audio)); a.playbackRate = 1; const { tl, words } = buildTimeline(m.text, m.words, 1);

    try { await a.play(); } catch (e) { finish(false); } return; }

    const { tl, words } = buildTimeline(m.text, null, rate); const t0 = performance.now(); const end = words.length ? words[words.length - 1].e + 0.2 : 1;

/* ---------- Ejemplos en 3D: el profe construye un modelo low-poly mientras explica ---------- */
const COL = { rojo: '#e5484d', azul: '#3b82f6', verde: '#22c55e', amarillo: '#facc15', naranja: '#fb923c', morado: '#a855f7', violeta: '#8b5cf6', rosa: '#f472b6', cian: '#22d3ee', turquesa: '#14b8a6', gris: '#9ca3af', negro: '#27272a', blanco: '#f4f4f5', marron: '#92400e', marrón: '#92400e', cobre: '#c26b3a', plata: '#cbd5e1', oro: '#eab308', dorado: '#eab308', beige: '#e7d3a8', piel: '#e9b48f', agua: '#38bdf8', fuego: '#f97316', tierra: '#a16207', hierba: '#4ade80' };

const stage = new THREE.Group(); scene.add(stage); const stageInner = new THREE.Group(); stage.add(stageInner);

let ITEMS = [], GROUPS = {}, SCENE_ON = false, sceneT = 0, buildStart = 0, EXPLODE = 0, explodeT = 0, userT = 0;
function labelSprite(text) { const c = document.createElement('canvas'); const x = c.getContext('2d', { willReadFrequently: true }); const fs = 44; x.font = `700 ${fs}px system-ui,sans-serif`; const w = Math.ceil(x.measureText(text).width) + 36; c.width = w; c.height = fs + 26;
  x.font = `700 ${fs}px system-ui,sans-serif`; x.fillStyle = 'rgba(15,18,26,.85)'; x.beginPath(); x.roundRect(0, 0, w, c.height, 16); x.fill(); x.fillStyle = '#ffe28a'; x.textBaseline = 'middle'; x.fillText(text, 18, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); sp.renderOrder = 10; const h = 0.125; sp.scale.set(h * w / c.height, h, 1); sp.userData.s0 = sp.scale.clone(); return sp; }
const V = (a, d = [0, 0, 0]) => Array.isArray(a) ? [+a[0] || 0, +a[1] || 0, +a[2] || 0] : d;
