const DEG=Math.PI/180, TAU=Math.PI*2;
let RNG=mulberry(12345); const reseed=s=>{RNG=mulberry(s);};
const rnd=(a,b)=>a+RNG()*(b-a);

const angDiff=(a,b)=>{let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;};
const ease=u=>{u=clamp(u,0,1);return u*u*(3-2*u)};

const AI={sample:null,enabled:true,busy:false,history:[]};
const SYS=`Eres el motor de órdenes de un plató 3D para previsualizar planos de cine. Conviertes la petición del usuario (en español) en comandos JSON que el motor ejecuta.

MUNDO: metros. Suelo plano y=0. x y z en el plano horizontal. heading en grados: 0 = mirando hacia +z, 90 = hacia +x, 180 = hacia -z, 270 = hacia -x.
La izquierda de una entidad que mira a heading h está en la dirección h+90 (p.ej. mirando a +z, su izquierda es +x).

COMANDOS
- {"op":"add","kind":K,"name":"opcional","color":"rojo|#hex","count":1,"x":0,"z":0 (o "at":POS),"heading":grados (o "face":"camera"|nombre),"scale":1,"size":[ancho,alto,largo] (solo objetos),"lights":true (coches),"siren":true (policía)}

  Sin posición: aparece delante de la cámara. Personas por defecto miran a cámara; coches cruzan el encuadre.
- {"op":"act","target":T,"action":A,"duration":seg} A: idle, wave, point, jump, punch, kick, push, throw, fall (de espaldas), stumble (de bruces), getup, sit, sitground, crouch, kneel, lie, dance, cheer, clap, talk, phone, lookaround, guard, handsup, bow.
  punch/kick/push golpean de verdad a quien esté delante a <1.5 m (el otro reacciona o cae). Antes de pelear, acércalos con goto y que se miren (look).
- {"op":"goto","target":T,"to":POS,"mode":"walk|run|sneak|crawl"}  (personas)
- {"op":"goto","target":T,"to":POS,"speed":kmh,"ram":true}  (vehículos; ram=true no frena: embiste. Sin ram se detiene antes del objetivo)
- {"op":"follow","target":T,"who":nombre,"mode":"walk|run","dist":m,"speed":kmh}  (seguir/perseguir; vehículos y personas)
- {"op":"flee","target":T,"from":nombre,"duration":6}
- {"op":"look","target":T,"at":nombre|"camera"|POS}  (gira el cuerpo)
- {"op":"headlook","target":T,"at":nombre|"camera"|null}  (solo la cabeza, se mantiene)
- {"op":"drive","target":T,"style":"straight|circle|eight|drift|reverse|turn","speed":kmh,"radius":m,"dir":"left|right","duration":seg}
- {"op":"brake","target":T} {"op":"lights","target":T,"on":true} {"op":"siren","target":T,"on":true}
- {"op":"enter","target":persona,"car":vehículo} (camina a la puerta y entra; luego el coche puede conducir) {"op":"exit","target":persona}
- {"op":"wait","target":T,"seconds":2} {"op":"stop","target":T}
- {"op":"place","target":T,"to":POS,"heading":grados} (teletransporta para colocar)
- {"op":"remove","target":T} {"op":"clear"} (borra todo) {"op":"rename","target":T,"name":"..."} {"op":"color","target":T,"color":"..."}
- {"op":"fx","type":"explosion|fire|smoke|dark smoke|sparks|dust|clear","at":POS,"duration":seg,"power":0.5-2}  (la explosión empuja, tira personas y vuelca coches cercanos; fire/smoke con "at":nombre se pegan a esa entidad)

POS = nombre de entidad | {"x":n,"z":n} | {"of":nombre|"camera","side":"front|behind|left|right","dist":m}

Si piden algo que no existe, aproxímalo con lo disponible y dilo en reply. No inventes ops.`;

function describeCmd(c,lang='es'){ const en=lang==='en'; const T=Array.isArray(c.target)?c.target.join(', '):(c.target||(en?'someone':'alguien'));

  case 'act': { const a=normAct(c.action)||c.action; s=en?`${T} ${ACT_EN[a]||a}`:`${T}: ${ACT_ES[a]||a}`; break; }
  case 'goto': { const st=normStyle(c.mode); const v=(c.speed!=null||c.ram)&&!c.mode?(en?(c.ram?'rams into':'drives to'):(c.ram?'embiste a':'conduce a')):({run:en?'runs to':'corre a',sneak:en?'sneaks to':'va sigiloso a',crawl:en?'crawls to':'se arrastra a'}[st]||(en?'walks to':'camina a')); s=`${T} ${v} ${to(c.to)}${c.speed?` (${c.speed} km/h)`:''}`; break; }
  case 'follow': s=en?`${T} chases ${c.who}`:`${T} persigue a ${c.who}`; break;
  case 'flee': s=en?`${T} flees${c.from?' from '+c.from:''}`:`${T} huye${c.from?' de '+c.from:''}`; break;

  case 'fx': { const t=norm(c.type); s=en?(/explo/.test(t)?'an explosion erupts':/fire|fuego/.test(t)?'fire breaks out':/smoke|humo/.test(t)?'smoke rises':/spark|chisp/.test(t)?'sparks fly':'dust rises'):(/explo/.test(t)?'💥 Explosión':/fire|fuego/.test(t)?'🔥 Fuego':/smoke|humo/.test(t)?'💨 Humo':/spark|chisp/.test(t)?'✨ Chispas':/clear/.test(t)?'🧹 Quitar efectos':'🟤 Polvo')+(c.at&&!en?' en '+to(c.at):''); break; }
  case 'camera': s=en?`camera: ${CAM_EN[normCam(c.mode||CAM.mode)]}`:`🎥 ${c.mode?CAM_MODES[normCam(c.mode)]:'Ajuste de cámara'}${c.target?' → '+c.target:''}`; break;
  case 'env': s=en?'the atmosphere changes':`🌤 ${[c.preset&&(PRESETS[normPreset(c.preset)]||[])[0],c.time!=null&&('hora '+(+c.time).toFixed(1)),c.weather].filter(Boolean).join(', ')||'Ambiente'}`; break;

const TAKE={log:[],snap:null,startStep:0,seed:1,replaying:false,base:0,endStep:0,camSrc:'orders',track:null,trackRec:null,target:0,count:true,clean:true,tail:3,ver:0,collect:null,expect:0,mode:null};
const CAMSRC={orders:'según órdenes',path:'ruta',track:'grabada a mano'};
function serFx(){ return FX.emitters.filter(em=>em.until>S.simTime+120).map(em=>({type:em.type,at:em.at?em.at.toArray():null,ent:em.ent?em.ent.id:null,dy:em.dy||0,acc:em.acc})); }
function snapshot(){ return {ents:S.ents.map(e=>e.serialize()),cam:{p:camera.position.toArray(),t:(CAM.mode==='free'?controls.target:CAM.look).toArray(),mode:CAM.mode,lens:CAM.lens,target:CAM.target,shake:CAM.shake,dutch:CAM.dutch,dist:CAM.dist,height:CAM.height,orbitSpeed:CAM.orbitSpeed,yaw:CAM.yaw,pitch:CAM.pitch},timeScale:S.timeScale,env:{...S.env},fx:serFx()}; }
function beginTake(){ TAKE.snap=snapshot(); TAKE.seed=1+Math.floor(Math.random()*1e6); reseed(TAKE.seed); TAKE.startStep=S.step; TAKE.log=[]; TAKE.track=null; if(TAKE.camSrc==='track') TAKE.camSrc='orders'; TAKE.ver++; }
function restoreSnap(sn,withCam=true){ const selName=S.sel?S.sel.name:null; const sil=S.silent; S.silent=true; clearEnts(); clearFx();
 if(sn.env&&sn.env.preset!==S.env.preset){ Object.assign(S.env,sn.env); buildEnv(S.env.preset); } else if(sn.env){ Object.assign(S.env,sn.env); updateLighting(); }
 for(const d of sn.ents) createEnt({...d});
 for(const f of sn.fx||[]){ const ent=f.ent!=null?S.byId.get(f.ent):null; if(f.ent!=null&&!ent) continue; const em=addEmitter(f.type,f.at?V().fromArray(f.at):null,1e9,ent?{ent,dy:f.dy}:{}); em.acc=f.acc||0; }
 S.timeScale=sn.timeScale||1;
 if(withCam&&sn.cam){ const c=sn.cam; CAM.fly=null; CAM.mode='free'; controls.enabled=true; CAM.fovOverride=null; camera.position.fromArray(c.p); controls.target.fromArray(c.t); CAM.look.fromArray(c.t);
  for(const k of ['lens','shake','dutch','dist','height','orbitSpeed']) if(c[k]!=null) CAM[k]=c[k]; CAM.target=c.target||null; applyLens(); controls.update();
  if(c.mode==='manual'){ setCamMode('manual'); if(c.yaw!=null){ CAM.yaw=c.yaw; CAM.pitch=c.pitch; } } else if(c.mode&&!['free','path','track'].includes(c.mode)) setCamMode(c.mode,{cut:true}); }
 S.silent=sil; select(selName?findEnt(selName):null); }
function snapPatch(e){ if(!TAKE.snap||TAKE.replaying) return; const i=TAKE.snap.ents.findIndex(d=>d.id===e.id); if(i>=0) TAKE.snap.ents[i]=e.serialize(); }
function snapRemove(e){ if(!TAKE.snap) return; TAKE.snap.ents=TAKE.snap.ents.filter(d=>d.id!==e.id); }
function patchSnapSetup(cmds,before){ if(cmds.some(c=>c.op==='clear')){ TAKE.snap=null; TAKE.log=[]; TAKE.track=null; TAKE.ver++; return; }
 for(const e of S.ents) if(!before.has(e.id)) TAKE.snap.ents.push(e.serialize()); TAKE.snap.ents=TAKE.snap.ents.filter(d=>S.byId.has(d.id));
 for(const c of cmds) if(['place','color','rename'].includes(c.op)) for(const e of S.ents) snapPatch(e);
 TAKE.snap.env={...S.env}; }
function logBatch(cmds){ const s=TAKE.replaying?S.step-TAKE.base:S.step-TAKE.startStep; const item={s,cmds:JSON.parse(JSON.stringify(cmds))}; let i=TAKE.log.length; while(i>0&&TAKE.log[i-1].s>s) i--; TAKE.log.splice(i,0,item); TAKE.ver++; }
function newTake(){ stopReplay(); for(const e of S.ents){ e.interrupt(); if(e.type==='vehicle'){ e.v=0; e.ds=0; } if(e.type==='person'){ e.kv.set(0,0,0); e.move=null; } } SCHED=[]; TAKE.log=[]; TAKE.snap=null; TAKE.track=null; if(TAKE.camSrc==='track') TAKE.camSrc='orders'; TAKE.ver++; S.paused=false; updTL(); refreshPanel('take'); updStatus(); toast('🆕 Toma nueva',3000,{sub:'Todo quieto. La próxima orden de acción empieza a grabar.'}); }
function takeLen(){ if(TAKE.target>0) return Math.round(TAKE.target/DT); const last=TAKE.log.length?TAKE.log[TAKE.log.length-1].s:0; let n=last+Math.round(TAKE.tail/DT);
 if(TAKE.camSrc==='path'&&CAM.path.length>1) n=Math.max(n,Math.round(CAM.pathDur/DT)); if(TAKE.camSrc==='track'&&TAKE.track&&TAKE.track.length) n=Math.max(n,TAKE.track[TAKE.track.length-1].s); return Math.max(n,Math.round(2/DT)); }
function prepReplay(o={}){ S.silent=true; SCHED=[]; restoreSnap(TAKE.snap,true); reseed(TAKE.seed); TAKE.replaying=true; TAKE.base=S.step; TAKE.endStep=TAKE.base+takeLen(); TAKE.trackRec=o.trackRec?[]:null;
 for(const b of TAKE.log){ const cmds=JSON.parse(JSON.stringify(b.cmds)); SCHED.push({st:TAKE.base+b.s,fn:()=>runBatch(cmds,{record:false,replay:true})}); }
 if(!o.trackRec){ if(TAKE.camSrc==='path'&&CAM.path.length>1) setCamMode('path'); else if(TAKE.camSrc==='track'&&TAKE.track&&TAKE.track.length) setCamMode('track'); }
 rigReset(); S.silent=false; S.acc=0; }
function stopReplay(){ if(!TAKE.replaying) return; if(RIG.live) rigLiveDone(); TAKE.replaying=false; TAKE.trackRec=null; TAKE.mode=null; SCHED=[]; if(REC.auto) stopRec(); if(S.cleanAuto) setClean(false); }
async function countdown(){ const c=$('#count'); c.style.display='grid'; for(const n of [3,2,1]){ c.textContent=n; vib(15); await new Promise(r=>setTimeout(r,650)); } c.style.display='none'; }
async function startReplay(o={}){ if(!TAKE.snap){ toast('Aún no hay toma',3500,{sub:'Da una orden de acción (andar, conducir, explosión…) y empieza a grabarse sola.'}); return; }
 if(TAKE.replaying) stopReplay(); if(REC.active) stopRec(); closeSheet(); hideCtx();
 if(o.rec&&!DL.save&&!o.force){ toast('Aquí no puedo descargar vídeo',4000,{sub:'Usa «Ocultar interfaz» + la grabación de pantalla del móvil.'}); o.rec=false; }
 if(o.count) await countdown();
 S.paused=false; prepReplay(o); TAKE.mode=o;
 if(o.from>0){ S.silent=true; const tgt=TAKE.base+Math.round(o.from/DT); let g=0; while(S.step<tgt&&TAKE.replaying&&g++<40000) stepSim(); S.silent=false; CAM.snap=true; }
 if(o.clean) setClean(true,true); if(o.rec) startRec(true); updTL(); updStatus(); }
function endReplay(){ TAKE.replaying=false; TAKE.startStep=TAKE.base; if(RIG.live) setTimeout(rigLiveDone,30); const o=TAKE.mode||{}; TAKE.mode=null;
 if(TAKE.trackRec){ TAKE.track=TAKE.trackRec; TAKE.trackRec=null; TAKE.camSrc='track'; TAKE.ver++; if(!S.silent) toast('🎥 Movimiento de cámara grabado',4000,{sub:'Las próximas repeticiones y grabaciones usarán tu cámara.'}); }
 if(REC.auto) stopRec();
 if(o.passes&&o.passes.length){ const next=o.passes.shift(); S.renderMode=next; applyRenderMode(); setTimeout(()=>startReplay({...o,count:false}),400); return; }
 if(o.restoreMode){ S.renderMode=o.restoreMode; applyRenderMode(); }
 if(S.cleanAuto) setClean(false); S.paused=true; if(!S.silent){ updTL(); updStatus(); refreshPanel('take'); } }
function scrubTo(s){ if(!TAKE.snap) return; if(REC.active){ toast('Grabando: espera a que termine'); return; } const len=takeLen(); s=clamp(Math.round(s),0,len);
 if(!(TAKE.replaying&&s>=S.step-TAKE.base)) prepReplay({}); TAKE.mode={}; S.silent=true; const target=TAKE.base+s; let g=0; while(S.step<target&&TAKE.replaying&&g++<40000) stepSim(); S.silent=false;
 S.paused=true; CAM.snap=true; updTL(); updStatus(); }
function curTakeStep(){ return TAKE.replaying?S.step-TAKE.base:Math.min(takeLen(),Math.max(0,S.step-TAKE.startStep)); }

const DL={save:null}; const REC={rec:null,chunks:[],active:false,auto:false,t0:0,mime:'',pass:'color'};
function pickMime(){ for(const m of ['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){ try{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
function startRec(auto=false){ if(REC.active) return; if(!window.MediaRecorder||!renderer.domElement.captureStream){ toast('Este navegador no deja grabar el lienzo',4000,{sub:'Usa la grabación de pantalla del móvil con 👁 activado.'}); return; }
 const a=ASPECTS[S.aspect]||canvasRect.w/canvasRect.h; recRes=a>=1?{w:1920,h:Math.round(1920/a/2)*2}:{w:Math.round(1920*a/2)*2,h:1920}; layout();
 const stream=renderer.domElement.captureStream(30); REC.mime=pickMime(); try{ REC.rec=new MediaRecorder(stream,REC.mime?{mimeType:REC.mime,videoBitsPerSecond:14e6}:{videoBitsPerSecond:14e6}); }catch(e){ recRes=null; layout(); toast('No se pudo iniciar la grabación'); return; }
 REC.pass=S.renderMode==='normal'?'color':S.renderMode; const pass=REC.pass; REC.chunks=[]; const chunks=REC.chunks; const rec=REC.rec;
 rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
 rec.onstop=()=>{ const type=rec.mimeType||REC.mime||'video/webm'; const blob=new Blob(chunks,{type}); const ext=/mp4/.test(type)?'mp4':'webm'; collectFile({blob,name:`toma-${stamp()}-${pass}.${ext}`,label:pass==='color'?'🎬 Vídeo (color)':pass==='depth'?'🌗 Vídeo de profundidad':'🎞 Pase '+pass}); };
 rec.start(250); REC.active=true; REC.auto=auto; REC.t0=performance.now(); $('#bRec').classList.add('on'); $('#recDot').style.display='block'; updHelpers(); }
function stopRec(){ if(!REC.active) return; REC.active=false; REC.auto=false; try{ REC.rec.stop(); }catch(e){} recRes=null; layout(); $('#bRec').classList.remove('on'); $('#recDot').style.display='none'; updHelpers(); }
const IN_APP=(()=>{ try{ return window.parent!==window&&window.parent.location.origin===location.origin; }catch(e){ return false; } })();
function sendToStudio(list){ const sn=TAKE.snap||snapshot(); const meta={prompt:PR.text||localPrompt(shotFacts()),aspect:S.aspect,duration:+(takeLen()*DT).toFixed(1),title:S.takeTitle||('Toma '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})),place:sn.env.preset,time:sn.env.time,weather:sn.env.weather,cast:sn.ents.filter(d=>PERSON_K.includes(d.kind)||VEH_K.includes(d.kind)).map(d=>({name:d.name,kind:d.kind,color:colorWord(d.color)}))};
 window.parent.postMessage({type:'plato:pack',files:list.map(f=>({name:f.name,label:f.label,blob:f.blob})),meta},location.origin); toast('✨ Enviado al Estudio'); }
function collectFile(f){ if(TAKE.collect){ TAKE.collect.push(f); if(TAKE.collect.length>=TAKE.expect){ const l=TAKE.collect; TAKE.collect=null; if(TAKE.onCollect){ const cb=TAKE.onCollect; TAKE.onCollect=null; cb(l); return; } if(S.shootId&&IN_APP){ const id=S.shootId; S.shootId=null; window.parent.postMessage({type:'plato:shot-done',id,files:l.map(f=>({name:f.name,label:f.label,blob:f.blob}))},location.origin); return; } if(S.sendStudio&&IN_APP){ S.sendStudio=false; sendToStudio(l); } else offerFiles(l); } } else offerFiles([f]); }
const stamp=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;};

 TAKE.collect=[]; TAKE.expect=3+(PR.text?1:0); if(PR.text) TAKE.collect.push({name:`prompt-${stamp()}.txt`,blob:new Blob([PR.text],{type:'text/plain'}),label:'📝 Prompt',preview:PR.text.slice(0,220)});

const STYLES=[['cine','🎞 Cine realista','photorealistic live-action cinema, shot on 35mm film, natural skin and materials, subtle film grain'],['anime','🌸 Anime','high-end anime film, clean cel shading, painterly backgrounds'],['cartoon','🧸 Animación 3D','stylized 3D animated feature film, soft global illumination, expressive characters'],['clay','🟠 Plastilina','claymation stop-motion, handmade clay textures, tactile miniature set'],['noir','🕶 Cine negro','black-and-white film noir, hard shadows, high contrast, smoky atmosphere'],['cyber','🌃 Cyberpunk','neon-soaked cyberpunk, wet reflective surfaces, volumetric haze'],['docu','📹 Documental','raw handheld documentary footage, available light, realistic'],['game','🎮 Videojuego','AAA video game cinematic, ultra-detailed real-time render']];
const PR={style:'cine',lang:'en',text:lsGet('plato3d_prompt')||'',busy:false};
const todEN=t=>t<5.5||t>=21?'at night':t<7.5?'at dawn':t<11?'in the morning':t<16?'at midday':t<18.3?'in the late afternoon':'at golden-hour sunset';
const todES=t=>t<5.5||t>=21?'de noche':t<7.5?'al amanecer':t<11?'por la mañana':t<16?'a mediodía':t<18.3?'por la tarde':'al atardecer, hora dorada';
function shotFacts(){ const sn=TAKE.snap||snapshot(); const st=STYLES.find(s=>s[0]===PR.style)||STYLES[0];
 const cast=sn.ents.filter(d=>PERSON_K.includes(d.kind)||VEH_K.includes(d.kind)).map(d=>({name:d.name,type:KIND_EN[d.kind],color:PR.lang==='es'?colorWord(d.color):(COLOR_EN[colorWord(d.color)]||'grey')}));
 const props={}; for(const d of sn.ents) if(PSPEC[d.kind]) props[KIND_EN[d.kind]]=(props[KIND_EN[d.kind]]||0)+1;
 return {duration_s:+(takeLen()*DT).toFixed(1),aspect:S.aspect,place:{studio:'empty studio',city:'city street',highway:'highway',desert:'desert',forest:'forest',grid:'abstract neon space'}[sn.env.preset],time:todEN(sn.env.time),weather:sn.env.weather,cast,props,
  beats:TAKE.log.map(b=>({t:+(b.s*DT).toFixed(1),what:b.cmds.filter(c=>c.op!=='add'&&c.op!=='camera').map(c=>describeCmd(c,'en')).join('; ')})).filter(b=>b.what),
  camera:{source:TAKE.camSrc,moves:[...new Set([sn.cam&&sn.cam.mode,...TAKE.log.flatMap(b=>b.cmds.filter(c=>c.op==='camera'&&c.mode).map(c=>normCam(c.mode)))].filter(Boolean).map(m=>CAM_EN[TAKE.camSrc==='orders'?m:TAKE.camSrc]))],lens_mm:Math.round((sn.cam&&sn.cam.lens)||CAM.lens),handheld:((sn.cam&&sn.cam.shake)||0)>0.1||TAKE.camSrc==='track'},style:st[2]}; }
function localPrompt(f){ const es=PR.lang==='es'; const wx={clear:'',fog:es?', con niebla densa':', in thick fog',rain:es?', bajo una lluvia intensa':', in heavy rain',storm:es?', en plena tormenta':', during a thunderstorm',snow:es?', con nieve cayendo':', with falling snow'}[f.weather]||'';
 const who=f.cast.map(c=>c.type==='person'||c.type==='child'?(es?`una persona vestida de ${c.color}`:`a ${c.type} dressed in ${c.color}`):(es?`un ${LABEL[Object.keys(KIND_EN).find(k=>KIND_EN[k]===c.type)]?.toLowerCase()} ${c.color}`:`a ${c.color} ${c.type}`)).join(', ');
 const beats=f.beats.map(b=>b.what).join(es?'; luego ':'; then ');
 const cam=f.camera.moves.join(', ')+`, ${f.camera.lens_mm}mm lens`+(f.camera.handheld?(es?', cámara en mano':', handheld feel'):'');
 return es?`${f.style}. Escena ${todES(TAKE.snap?TAKE.snap.env.time:S.env.time)} en ${f.place}${wx}. Personajes: ${who||'—'}. Acción: ${beats||'—'}. Cámara: ${cam}. Mantén exactamente el movimiento, el ritmo y el encuadre del vídeo de referencia; sustituye los maniquíes grises y las formas simples por personas y vehículos reales y detallados.\n\nNegativo: maniquíes, formas geométricas, render gris, deformaciones, parpadeo, texto, marcas de agua`
  :`${f.style}. ${f.place[0].toUpperCase()+f.place.slice(1)} ${f.time}${wx}. Cast: ${who||'—'}. Action: ${beats||'—'}. Camera: ${cam}. Keep the exact motion, timing and framing of the reference video; replace the grey mannequins and simple shapes with real, detailed people and vehicles.\n\nNegative: mannequins, geometric primitives, grey render, morphing, flicker, extra limbs, text, watermark`; }

SHOT FACTS: ${JSON.stringify(f)}`); PR.text=(r.prompt||'')+(r.negative?`\n\n${PR.lang==='es'?'Negativo':'Negative'}: ${r.negative}`:''); if(!r.prompt) throw 0; }

addEventListener('message',e=>{ if(e.origin!==location.origin||!e.data||e.data.type!=='plato:shoot') return; shootShot(e.data).catch(err=>window.parent.postMessage({type:'plato:shot-done',id:e.data.id,error:String(err&&err.message||err)},location.origin)); });
function hostOf(){ try{ return IN_APP&&window.parent.__studioHost&&window.parent.__studioHost.ready?window.parent.__studioHost:null; }catch(e){ return null; } }
function applyHost(){ const h=hostOf(); if(!h) return; if(!AI.fromClaude&&!studioLLM()&&h.sample) AI.sample=h.sample; if(h.save) DL.save=o=>h.save(o); updAiBtn(); refreshPanel(); }
addEventListener('message',e=>{ if(e.origin===location.origin&&e.data&&e.data.type==='host:ready') applyHost(); }); applyHost();
addEventListener('storage',e=>{ if(e.key==='studio_settings'&&!AI.fromClaude){ AI.sample=studioLLM()||(hostOf()&&hostOf().sample)||null; updAiBtn(); refreshPanel(); } });
(async()=>{ try{ let tries=0; while(!(window.claude&&window.claude.use)&&tries++<15) await new Promise(r=>setTimeout(r,200)); if(!(window.claude&&window.claude.use)) return;
  const [sm,dl]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('downloads').catch(()=>null)]); if(sm){ AI.sample=sm; AI.fromClaude=true; } if(dl&&dl.save) DL.save=(o=>dl.save(o)); updAiBtn(); refreshPanel(); }catch(e){} })();
addEventListener('error',e=>console.warn(e.message));
</script>
</body>
</html>
